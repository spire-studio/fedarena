# Scenario: MNIST IID
# IID data distribution on MNIST, 30% malicious clients

dataset:
  name: MNIST
  distribution: iid
  alpha: 0.5

model:
  name: CNN
  input_shape: [28, 28, 1]
  num_classes: 10

federated:
  num_clients: 10
  num_rounds: 20
  clients_per_round: 10
  local_epochs: 5
  learning_rate: 0.01
  aggregation: fedavg

attack:
  enable: false
  attacker_selector:
    mode: ratio
    ratio: 0.3
    selection_policy: lowest_ids
  attack_category: model
  attack_type: research
  attack_params: {}

defense:
  enable: false
  strategy: research
  defense_params: {}

compression:
  sparsification:
    enable: false

privacy:
  homomorphic_encryption:
    enable: false

system:
  mode: simulation
  node_role: server

logging:
  log_dir: ./logs
  save_results: true
  results_dir: ./results/bench
